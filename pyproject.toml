[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speeddrop"
version = "1.0.0"
description = "Instant Peer-to-Peer Wi-Fi LAN File Transfer CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["p2p", "lan", "file-sharing", "airdrop-alternative", "wifi-transfer", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: File Sharing",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
speeddrop = "speeddrop.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/speeddrop"
Repository = "https://github.com/MochErik/speeddrop.git"
Issues = "https://github.com/MochErik/speeddrop/issues"
